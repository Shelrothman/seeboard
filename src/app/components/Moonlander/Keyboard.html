        <g id="ML71" class="group thumb {groups.ML ? 'targetGroup' : ''} {targetKeys.indexOf('ML71') !== -1 ? 'target' : ''} {pressedKeys.ML71 ? 'pressed' : ''}">
            <rect class="keytop" x="1070" y="500" width="110" height="75" rx="8" transform="rotate(90 1125 537.5)" on:click="handleKeyClick('ML71')"/>
        </g>
    </g>

    <!-- Finger-guide hands overlay: translucent, click-through, scales with the viewBox.
         The finger matching the current target key's group/side lights up. -->
    {#if showHands}
    <g class="hands">
        <!-- Left hand: fingers rise over the A/S/D/F home columns, palm rests low -->
        <g class="hand hand-left">
            <rect class="palm" x="120" y="300" width="360" height="130" rx="30"/>
            <rect class="finger pinky {activeFinger && activeFinger.side === 'left' && activeFinger.finger === 'pinky' ? 'active' : ''}" x="150" y="150" width="50" height="170" rx="25"/>
            <rect class="finger ring {activeFinger && activeFinger.side === 'left' && activeFinger.finger === 'ring' ? 'active' : ''}" x="235" y="130" width="50" height="190" rx="25"/>
            <rect class="finger middle {activeFinger && activeFinger.side === 'left' && activeFinger.finger === 'middle' ? 'active' : ''}" x="320" y="120" width="50" height="200" rx="25"/>
            <rect class="finger index {activeFinger && activeFinger.side === 'left' && activeFinger.finger === 'index' ? 'active' : ''}" x="405" y="140" width="55" height="180" rx="27"/>
            <rect class="finger thumb {activeFinger && activeFinger.side === 'left' && activeFinger.finger === 'thumb' ? 'active' : ''}" x="455" y="420" width="55" height="130" rx="27" transform="rotate(45 482 430)"/>
        </g>
        <!-- Right hand: exact mirror of the left, index resting on J home column -->
        <g class="hand hand-right">
            <rect class="palm" x="1120" y="300" width="360" height="130" rx="30"/>
            <rect class="finger index {activeFinger && activeFinger.side === 'right' && activeFinger.finger === 'index' ? 'active' : ''}" x="1140" y="140" width="55" height="180" rx="27"/>
            <rect class="finger middle {activeFinger && activeFinger.side === 'right' && activeFinger.finger === 'middle' ? 'active' : ''}" x="1230" y="120" width="50" height="200" rx="25"/>
            <rect class="finger ring {activeFinger && activeFinger.side === 'right' && activeFinger.finger === 'ring' ? 'active' : ''}" x="1315" y="130" width="50" height="190" rx="25"/>
            <rect class="finger pinky {activeFinger && activeFinger.side === 'right' && activeFinger.finger === 'pinky' ? 'active' : ''}" x="1400" y="150" width="50" height="170" rx="25"/>
            <rect class="finger thumb {activeFinger && activeFinger.side === 'right' && activeFinger.finger === 'thumb' ? 'active' : ''}" x="1090" y="420" width="55" height="130" rx="27" transform="rotate(-45 1118 430)"/>
        </g>
    </g>
    {/if}
</svg>

<script>
    import _ from "lamb";
    import {invertObj} from "@utils/objUtils";
    import {joinWithEmpty} from "@utils/arrayUtils";
    import keyToCharData from "./keyToChar.json";

    // Get layer-specific mapping
    const getLayerMapping = (layer) => keyToCharData[`layer${layer}`] || keyToCharData.layer0;

    // Which finger presses each key — transcribed directly from the "group <finger>"
    // class on each key's <g> above, so this stays the single source of truth for the
    // hand overlay's active-finger highlight.
    const KEY_FINGER = {
        // Left side
        ML00: 'pinky', ML01: 'pinky', ML02: 'ring', ML03: 'middle', ML04: 'index', ML05: 'index', ML06: 'index',
        ML14: 'pinky', ML15: 'pinky', ML16: 'ring', ML17: 'middle', ML18: 'index', ML19: 'index', ML20: 'index',
        ML28: 'pinky', ML29: 'pinky', ML30: 'ring', ML31: 'middle', ML32: 'index', ML33: 'index', ML34: 'index',
        ML42: 'pinky', ML43: 'pinky', ML44: 'ring', ML45: 'middle', ML46: 'index', ML47: 'index',
        ML54: 'thumb', ML55: 'thumb', ML56: 'thumb', ML57: 'thumb', ML58: 'thumb', ML59: 'thumb',
        ML66: 'thumb', ML67: 'thumb', ML68: 'thumb',
        // Right side — home row is index on J, mirroring the left's index on F
        ML07: 'index', ML08: 'index', ML09: 'index', ML10: 'middle', ML11: 'ring', ML12: 'pinky', ML13: 'pinky',
        ML21: 'index', ML22: 'index', ML23: 'index', ML24: 'middle', ML25: 'ring', ML26: 'pinky', ML27: 'pinky',
        ML35: 'index', ML36: 'index', ML37: 'index', ML38: 'middle', ML39: 'ring', ML40: 'pinky', ML41: 'pinky',
        ML48: 'index', ML49: 'index', ML50: 'middle', ML51: 'ring', ML52: 'pinky', ML53: 'pinky',
        ML60: 'thumb', ML61: 'thumb', ML62: 'thumb', ML63: 'thumb', ML64: 'thumb', ML65: 'thumb',
        ML69: 'thumb', ML70: 'thumb', ML71: 'thumb'
    };

    // Right-hand key IDs. Rows interleave left/right ranges, so there's no clean
    // numeric cutoff — list them explicitly. Anything else is a left-hand key.
    const RIGHT_KEYS = new Set([
        'ML07', 'ML08', 'ML09', 'ML10', 'ML11', 'ML12', 'ML13',
        'ML21', 'ML22', 'ML23', 'ML24', 'ML25', 'ML26', 'ML27',
        'ML35', 'ML36', 'ML37', 'ML38', 'ML39', 'ML40', 'ML41',
        'ML48', 'ML49', 'ML50', 'ML51', 'ML52', 'ML53',
        'ML60', 'ML61', 'ML62', 'ML63', 'ML64', 'ML65',
        'ML69', 'ML70', 'ML71'
    ]);

    const keySide = (id) => RIGHT_KEYS.has(id) ? 'right' : 'left';

    export default {
        data () {
            return {
                pressedChars: [],
                groups: {},
                showHands: false
            }
        },
        computed: {
            keyToChar: ({currentLayer}) => getLayerMapping(currentLayer),
            charToKey: ({keyToChar}) => invertObj(keyToChar),
            pressedKeys: ({pressedChars, keyToChar}) =>
                _.mapValues(keyToChar, char => _.isIn(pressedChars, char)),
            targetKeys: ({targetChar, currentLayer}) => {
                console.log('targetKeys recalculating for char:', targetChar, 'layer:', currentLayer);
                // Only check the currently active layer
                const allKeys = [];
                
                const layerMapping = getLayerMapping(currentLayer);
                const layerCharToKey = invertObj(layerMapping);
                const key = layerCharToKey[targetChar];
                
                if (key !== undefined) {
                    // Check if it's a shift combination
                    if (key.startsWith('Shift+')) {
                        const baseKey = key.replace('Shift+', '');
                        // Add both shift keys and the base key
                        allKeys.push('ML42'); // left shift
                        allKeys.push('ML53'); // right shift
                        allKeys.push(baseKey);
                    } else {
                        // Regular key
                        allKeys.push(key);
                    }
                }
                
                console.log('targetKeys result:', allKeys);
                return allKeys;
            },
            groups: ({targetKeys}) => {
                if (!targetKeys || targetKeys.length === 0) return {};
                // All Moonlander keys start with "ML" so group by that
                const hasML = targetKeys.some(key => key && key.startsWith('ML'));
                return { ML: hasML };
            },
            activeFinger: ({targetKeys}) => {
                if (!targetKeys || targetKeys.length === 0) return null;
                // For shifted chars, targetKeys injects both Shift keys (ML42/ML53)
                // plus the base key — highlight the base key's finger, not Shift.
                const realKey = targetKeys.find(k => k !== 'ML42' && k !== 'ML53') || targetKeys[0];
                const finger = KEY_FINGER[realKey];
                if (!finger) return null;
                return { side: keySide(realKey), finger };
            }
        },
        
        methods: {
            handleSvgClick(event) {
                console.log('SVG clicked, event.target:', event.target);
                // Find the clicked key by looking for parent <g> with id starting with ML
                let target = event.target;
                let keyId = null;
                
                // Traverse up to find the <g> element with ML id
                while (target && target.tagName !== 'svg') {
                    console.log('Checking element:', target.tagName, target.id);
                    if (target.tagName === 'g' && target.id && target.id.startsWith('ML')) {
                        keyId = target.id;
                        console.log('Found keyId:', keyId);
                        break;
                    }
                    target = target.parentNode;
                }
                
                console.log('Final keyId:', keyId);
                if (keyId) {
                    this.handleKeyClick(keyId);
                } else {
                    console.log('No key found!');
                }
            },
            
            handleKeyClick(keyId) {
                const {keyToChar, currentLayer} = this.get();
                const char = keyToChar[keyId];
                
                console.log('Key clicked:', keyId, 'char:', char, 'currentLayer:', currentLayer);
                
                // Check if it's a layer toggle key
                if (char === '_Layer1') {
                    console.log('Firing layerChange to layer 1');
                    this.fire('layerChange', { layer: 1 });
                } else if (char === '_Layer2' || char === '_LayerQ') {
                    console.log('Firing layerChange to layer 2');
                    this.fire('layerChange', { layer: 2 });
                } else if (keyId === 'ML65' && currentLayer === 1) {
                    console.log('Firing layerChange to layer 0');
                    // Toggle back to layer 0 from layer 1
                    this.fire('layerChange', { layer: 0 });
                }
            }
        }
    }
</script>
